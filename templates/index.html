<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер температур</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input { width: 100px; padding: 6px; }
        .result { font-size: 1.3em; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>Конвертер температур</h1>
    <form method="get" action="/">
        <input type="text" name="value" value="{{ value }}" placeholder="Число" required>
        <select name="src">
            {% for u in units %}<option value="{{ u }}" {{ 'selected' if u == src }}>{{ u.upper() }}</option>{% endfor %}
        </select>
        →
        <select name="dst">
            {% for u in units %}<option value="{{ u }}" {{ 'selected' if u == dst }}>{{ u.upper() }}</option>{% endfor %}
        </select>
        <button type="submit">Перевести</button>
    </form>
    {% if result is not none %}<p class="result">Результат: {{ result }} °{{ dst.upper() }}</p>{% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
</body>
</html>
